name: Build Windows app

on:
  push:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 90

      - name: Keep only the three latest builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("atlas-windows-")) | [.id, .created_at] | @tsv' \
            | sort -k2,2r \
            | tail -n +4 \
            | cut -f1 \
            | while read -r artifact_id; do
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
