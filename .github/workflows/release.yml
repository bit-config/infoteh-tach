name: Build and publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Configure private updater access
        shell: pwsh
        env:
          UPDATER_GITHUB_TOKEN: ${{ secrets.UPDATER_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_GITHUB_TOKEN)) { throw "Add the UPDATER_GITHUB_TOKEN Actions secret before building." }
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $endpoint = $config.plugins.updater.endpoints[0]
          $endpoint.headers.Authorization = "Bearer $env:UPDATER_GITHUB_TOKEN"
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_PASSWORD: ${{ secrets.APPLE_SIGNING_IDENTITY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Atlas ${{ github.ref_name }}"
          releaseBody: "Новая версия Atlas. Установщики и подписанные файлы обновления приложены ниже."
          releaseDraft: true
          prerelease: false
          args: ""
