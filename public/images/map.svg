  <path d="M1285-80c-65 135-35 250-155 380s-100 245-220 375-165 175-195 305" stroke="#a9c8c0" stroke-width="5"/>

  <!-- Park and garden district. -->
  <path d="M90 95h490v270H90z" fill="#dce7d4" stroke="#c7d5c0" stroke-width="3"/>
  <path d="M105 110h460v240H105z" fill="url(#trees)"/>
  <path d="M105 232h460M328 110v240" stroke="#f4f1e7" stroke-width="12"/>
  <path d="M120 125h430v210H120z" stroke="#f4f1e7" stroke-width="3" stroke-dasharray="8 10"/>
  <circle cx="324" cy="231" r="31" fill="#c4d7b9" stroke="#f4f1e7" stroke-width="8"/>
  <path d="M287 232h74M324 195v74" stroke="#f4f1e7" stroke-width="7"/>

  <!-- Deliberate street grid with a few named avenues. -->
  <g stroke="#fffdf6" stroke-linecap="round">
    <path d="M0 410h780M0 560h685M0 735h555M610 0v900M390 0v900M1450 0v900" stroke-width="18"/>
    <path d="M0 410h780M0 560h685M0 735h555M610 0v900M390 0v900M1450 0v900" stroke="#d4d4c9" stroke-width="2"/>
    <path d="M0 460h755M0 610h650M0 785h530M660 0v900M440 0v900M1495 0v900" stroke-width="4"/>
  </g>
  <path d="M560 0v900M220 0v900M1320 0v900M0 300h800M0 670h590" stroke="#d4d8cc" stroke-width="2" stroke-dasharray="5 8"/>

  <!-- Embankment promenade and a small pier. -->
  <path d="M745 760c115-130 110-250 250-375s95-225 185-350" stroke="#f6f3e8" stroke-width="18"/>
  <path d="M745 760c115-130 110-250 250-375s95-225 185-350" stroke="#c7c9bc" stroke-width="2"/>
  <path d="M800 585l-54-44m83 11-53-46m81 12-52-45" stroke="#b99572" stroke-width="9" stroke-linecap="round"/>

  <!-- Map labels and neighborhood anchors. -->
  <g fill="#788477" font-family="Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">
    <text x="142" y="160">ЛЕТНИЙ САД</text>
    <text x="170" y="500">ТИХИЙ ПЕРЕУЛОК</text>
    <text x="1110" y="165">ПЕТРОГРАДСКАЯ СТОРОНА</text>
    <text x="1120" y="730">СТАРАЯ НАБЕРЕЖНАЯ</text>
  </g>
  <text x="1050" y="500" fill="#6e9b91" font-family="Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="5" transform="rotate(-48 1050 500)">БОЛЬШАЯ НЕВКА</text>
  <g fill="#8d9789" font-family="monospace" font-size="13" letter-spacing="2">
    <text x="45" y="55">59°57′ N</text>
    <text x="1390" y="855">30°19′ E</text>
  </g>
  <g fill="#748574">
    <circle cx="324" cy="231" r="7"/><circle cx="324" cy="231" r="15" stroke="#748574" stroke-width="2" fill="none"/>
    <circle cx="700" cy="350" r="5"/><circle cx="1480" cy="600" r="5"/>
  </g>
  <g transform="translate(1510 70)" stroke="#718071" stroke-width="3" fill="none">
    <path d="M0 48 18 0l18 48-18-10z" fill="#718071"/>
    <path d="M18 0v64"/>
  </g>
  <text x="1521" y="154" fill="#718071" font-family="monospace" font-size="14" letter-spacing="2">N</text>
</svg>
