<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <pattern id="blocks" width="160" height="140" patternUnits="userSpaceOnUse">
      <path d="M12 12h126v102H12z" fill="#e7e8dc" stroke="#d8dbcf" stroke-width="2"/>
      <path d="M24 25h42v30H24zm58 0h44v30H82zm-58 43h44v32H24zm60 0h34v32H84z" fill="#dfe3d6"/>
    </pattern>
    <pattern id="trees" width="34" height="36" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="5" fill="#9caf91"/>
      <circle cx="25" cy="26" r="6" fill="#a8b99b"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#f1f0e8"/>
  <path d="M0 0h1600v900H0z" fill="url(#blocks)"/>

  <!-- The river and its embankments form the main geographic axis. -->
  <path d="M1000-80c-110 170-20 260-150 390s-110 240-250 390-100 210-130 280h440c30-130 70-180 195-305s100-245 220-375 90-245 155-380z" fill="#c8dcd7"/>
